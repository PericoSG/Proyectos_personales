<h1>Participantes</h1>
<div class="bf-container">
  @for (participant of participants; track $index){
  <div id="bf-card-oficial" class="bf-card">
    <div class="bf-help-icon"> ? </div>
    <img class="bf-card-img" [src]="participant.image" alt="{{ participant.name }}">
    <div class="bf-card-info">
      <h2 class="bf-card-name">{{ participant.name }}</h2>
      <h3 class="bf-card-song">{{ participant.song }}</h3>
    </div>
  </div>
  }
</div>
