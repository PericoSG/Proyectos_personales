<div class="min-vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="card shadow-lg p-5 rounded-4" style="width: 600px; max-width: 95%;">

    <!-- LOGO -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-warning">☀️ SummerFun</h2>
      <p class="text-muted">Accede a tu cuenta</p>
    </div>

    <!-- BLOQUE DE OPCIONES -->
    <div class="d-flex flex-column gap-3">

      <!-- GOOGLE -->
      <button class="btn btn-outline-dark w-100 rounded-3 d-flex align-items-center justify-content-center gap-2">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="22">
        <span class="fw-semibold">Continuar con Google</span>
      </button>

      <!-- TELÉFONO -->
      <button class="btn btn-outline-primary w-100 rounded-3 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-phone-fill fs-5"></i>
        <span class="fw-semibold">Continuar con teléfono</span>
      </button>

      <!-- SEPARADOR -->
      <div class="text-center text-muted small">o</div>

      <!-- EMAIL + CONTRASEÑA -->
      <form class="d-flex flex-column gap-3">

        <div>
          <label class="form-label fw-semibold">Correo electrónico</label>
          <input type="email" class="form-control rounded-3" placeholder="tuemail@ejemplo.com">
        </div>

        <div>
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control rounded-3" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary w-100 rounded-3 fw-semibold">
          Iniciar sesión
        </button>
      </form>

    </div>

    <!-- ENLACES -->
    <div class="text-center mt-4">
      <a href="/registro.html" class="text-decoration-none fw-semibold text-primary">Crear cuenta</a>
      <br>
      <a href="#" class="text-decoration-none text-muted small">¿Olvidaste tu contraseña?</a>
    </div>

  </div>
</div>
